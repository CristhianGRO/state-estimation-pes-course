<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="t d"><title id="t">Assignment 6 radial three-bus network</title><desc id="d">Bus 1 connects to bus 2 and bus 2 to bus 3. Measurements include bidirectional branch powers, bus 2 injections, and bus 1 and 3 voltages. Bus 1 provides the angle reference.</desc>
