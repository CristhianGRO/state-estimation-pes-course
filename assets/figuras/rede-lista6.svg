<g fill="#008f96" font-family="Arial,sans-serif" font-size="21" text-anchor="middle"><text x="350" y="120">P12, Q12 →</text><text x="350" y="185">← P21, Q21</text><text x="750" y="120">P23, Q23 →</text><text x="750" y="185">← P32, Q32</text></g>
