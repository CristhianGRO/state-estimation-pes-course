<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="t d"><title id="t">Observable islands</title><desc id="d">A physically connected network can contain two information islands.</desc><rect width="1100" height="340" rx="20" fill="#f1f7fa"/><g font-family="Arial,sans-serif"><rect x="35" y="70" width="460" height="200" rx="24" fill="#e1f3f2"/><rect x="605" y="70" width="460" height="200" rx="24" fill="#e6eefb"/><path d="M140 170L390 170" stroke="#008f96" stroke-width="4" fill="none"/><path d="M710 170L960 170" stroke="#008f96" stroke-width="4" fill="none"/><path d="M390 170L710 170" stroke="#4c6076" stroke-width="3" fill="none" stroke-dasharray="9 9"/><circle cx="140" cy="170" r="24" fill="#e4f8f6" stroke="#008f96" stroke-width="3"/><text x="140" y="178" fill="#09213a" font-size="22" text-anchor="middle">1</text><circle cx="390" cy="170" r="24" fill="#e4f8f6" stroke="#008f96" stroke-width="3"/><text x="390" y="178" fill="#09213a" font-size="22" text-anchor="middle">2</text><circle cx="710" cy="170" r="24" fill="#e4f8f6" stroke="#008f96" stroke-width="3"/><text x="710" y="178" fill="#09213a" font-size="22" text-anchor="middle">3</text><circle cx="960" cy="170" r="24" fill="#e4f8f6" stroke="#008f96" stroke-width="3"/><text x="960" y="178" fill="#09213a" font-size="22" text-anchor="middle">4</text><text x="260" y="115" fill="#09213a" font-size="22" text-anchor="middle">Observable island A</text><text x="835" y="115" fill="#09213a" font-size="22" text-anchor="middle">Observable island B</text><text x="260" y="230" fill="#09213a" font-size="18" text-anchor="middle">Measured flow P12</text><text x="835" y="230" fill="#09213a" font-size="18" text-anchor="middle">Measured flow P34</text><text x="550" y="305" fill="#4c6076" font-size="20" text-anchor="middle">Physical branch 2–3 has no determined relative angle</text></g></svg>
