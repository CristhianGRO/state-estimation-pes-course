<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="t d"><title id="t">Kalman prediction and measurement update</title><desc id="d">A prior estimate is propagated through a transition model, then corrected using current measurements and their uncertainties.</desc><rect width="1100" height="320" rx="20" fill="#f1f7fa"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="white" stroke="#d7e4ed" stroke-width="2"><rect x="30" y="90" width="300" height="140" rx="16"/><rect x="400" y="90" width="300" height="140" rx="16"/><rect x="770" y="90" width="300" height="140" rx="16"/></g><g fill="#09213a" font-size="25"><text x="180" y="145">Previous posterior</text><text x="550" y="145">Predict</text><text x="920" y="145">Update</text></g><g fill="#4c6076" font-size="19"><text x="180" y="180">State and covariance</text><text x="550" y="180">Transition model + Q</text><text x="920" y="180">Measurements + R</text><text x="550" y="280">Repeat for each new observation</text></g><g fill="#008f96" font-size="48"><text x="365" y="174">→</text><text x="735" y="174">→</text></g></g></svg>
