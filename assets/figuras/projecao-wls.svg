<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="t d"><title id="t">WLS projection</title><desc id="d">In whitened coordinates, a measurement is decomposed into a projection onto the model space and an orthogonal residual.</desc><rect width="1100" height="370" rx="20" fill="#f1f7fa"/><g font-family="Arial,sans-serif"><path d="M100 290L970 290" stroke="#3167bd" stroke-width="5" fill="none"/><text x="920" y="325" fill="#3167bd" font-size="19" text-anchor="middle">Range of H</text><path d="M200 290L650 70" stroke="#09213a" stroke-width="4" fill="none"/><path d="M200 290L650 290" stroke="#008f96" stroke-width="6" fill="none"/><path d="M650 290L650 70" stroke="#c46b22" stroke-width="5" fill="none"/><text x="680" y="70" fill="#09213a" font-size="28" text-anchor="middle">z</text><text x="690" y="285" fill="#008f96" font-size="23" text-anchor="middle">ẑ = Kz</text><text x="720" y="175" fill="#c46b22" font-size="22" text-anchor="middle">r = z − ẑ</text><text x="200" y="325" fill="#4c6076" font-size="18" text-anchor="middle">Origin</text><text x="390" y="330" fill="#008f96" font-size="19" text-anchor="middle">Fitted component</text><text x="520" y="30" fill="#4c6076" font-size="20" text-anchor="middle">Geometry in whitened coordinates</text></g></svg>
