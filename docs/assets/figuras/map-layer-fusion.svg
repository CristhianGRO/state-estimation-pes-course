<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc"><title id="title">Hierarchical slow-to-fast Bayesian MAP fusion</title><desc id="desc">A slow measurement layer creates a posterior that becomes a temporally propagated prior for a fast measurement layer and its MAP update.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#245a80"/></marker></defs><rect width="960" height="280" rx="20" fill="#f7fafc"/><g fill="#fff" stroke="#245a80" stroke-width="2"><rect x="24" y="79" width="183" height="117" rx="15"/><rect x="259" y="79" width="176" height="117" rx="15"/><rect x="487" y="79" width="180" height="117" rx="15"/><rect x="718" y="79" width="218" height="117" rx="15"/></g><g fill="#173a59" font-family="sans-serif" text-anchor="middle" font-size="19" font-weight="bold"><text x="115" y="118">Slow measurements</text><text x="347" y="118">MAP posterior</text><text x="577" y="118">Propagate prior</text><text x="825" y="118">Fast-layer MAP</text></g><g fill="#4b6172" font-family="sans-serif" text-anchor="middle" font-size="15"><text x="115" y="149">15-min SCADA/MI</text><text x="347" y="149">mean + covariance</text><text x="577" y="149">state uncertainty</text><text x="825" y="149">PMU likelihood</text></g><g fill="none" stroke="#245a80" stroke-width="3" marker-end="url(#arrow)"><path d="M207 138 H257"/><path d="M435 138 H485"/><path d="M667 138 H716"/></g><text x="480" y="39" fill="#173a59" font-size="21" font-family="sans-serif" text-anchor="middle">Time-aware information transfer — not reuse of stale readings as fresh data</text><text x="480" y="242" fill="#637487" font-size="15" font-family="sans-serif" text-anchor="middle">Pedagogical schematic adapted from the hierarchical MAP formulation in the CBA 2026 article</text></svg>
