<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="tt dd"><title id="tt">Three-bus observability example</title><desc id="dd">Three physically connected buses, with power flow measurements P12, P21, P13 and P23 and an example where only buses 1 and 2 are informed.</desc><rect width="900" height="360" rx="20" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#173452"><text x="40" y="42" font-size="23" font-weight="700">Physical network</text><text x="485" y="42" font-size="23" font-weight="700">Meter set {P12, P21}</text></g><g stroke="#8395a9" stroke-width="8" fill="none" stroke-linecap="round"><path d="M120 125L340 125L230 280Z"/><path d="M565 125L785 125L675 280Z"/></g><path d="M565 125L785 125" stroke="#188b68" stroke-width="9"/><g fill="#fff" stroke="#294d73" stroke-width="5"><circle cx="120" cy="125" r="24"/><circle cx="340" cy="125" r="24"/><circle cx="230" cy="280" r="24"/><circle cx="565" cy="125" r="24"/><circle cx="785" cy="125" r="24"/><circle cx="675" cy="280" r="24"/></g><g font-family="Arial,sans-serif" fill="#173452" font-size="19" text-anchor="middle"><text x="120" y="132">1</text><text x="340" y="132">2</text><text x="230" y="287">3</text><text x="565" y="132">1</text><text x="785" y="132">2</text><text x="675" y="287">3</text></g><g font-family="Arial,sans-serif" font-size="17"><text x="216" y="97" fill="#188b68">P12 / P21</text><text x="130" y="226" fill="#47627e">P13</text><text x="316" y="226" fill="#47627e">P23</text><text x="649" y="97" fill="#188b68">P12 / P21</text><text x="485" y="328" fill="#188b68">Informed angle difference θ2 − θ1</text><text x="485" y="350" fill="#ad453f">θ3 unconstrained</text></g><path d="M870 265l-20 -10m20 10l-20 10" stroke="#ad453f" stroke-width="3" fill="none"/></svg>
