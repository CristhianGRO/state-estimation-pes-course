<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">State estimation stages</title><desc id="desc">Measurements and switch status feed the topology processor. Observability analysis precedes WLS estimation and bad-data processing. The validated state feeds operational applications.</desc>
