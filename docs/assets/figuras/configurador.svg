<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="t d"><title id="t">Topological reduction</title><desc id="d">Two sections connected by an ideal closed device are grouped into one bus.</desc><rect width="1100" height="340" rx="20" fill="#f1f7fa"/><g font-family="Arial,sans-serif"><rect x="30" y="80" width="180" height="150" rx="16" fill="white" stroke="#d7e4ed" stroke-width="2"/><text x="120.0" y="150.0" fill="#09213a" font-size="24" text-anchor="middle">Section A</text><text x="120.0" y="183.0" fill="#4c6076" font-size="18" text-anchor="middle">same voltage level</text><rect x="320" y="80" width="180" height="150" rx="16" fill="white" stroke="#d7e4ed" stroke-width="2"/><text x="410.0" y="150.0" fill="#09213a" font-size="24" text-anchor="middle">Section B</text><text x="410.0" y="183.0" fill="#4c6076" font-size="18" text-anchor="middle">line terminal</text><path d="M210 150L320 150" stroke="#008f96" stroke-width="4" fill="none"/><text x="265" y="125" fill="#09213a" font-size="17" text-anchor="middle">Closed switch</text><text x="600" y="160" fill="#008f96" font-size="60" text-anchor="middle">→</text><rect x="740" y="80" width="280" height="150" rx="16" fill="white" stroke="#d7e4ed" stroke-width="2"/><text x="880.0" y="150.0" fill="#09213a" font-size="24" text-anchor="middle">Electrical bus</text><text x="880.0" y="183.0" fill="#4c6076" font-size="18" text-anchor="middle">A and B merged</text></g></svg>
